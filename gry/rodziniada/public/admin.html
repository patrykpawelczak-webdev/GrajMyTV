<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodziniada - Panel admina</title>
    <link rel="stylesheet" href="/rodziniada/css/admin.css">
    <link rel="stylesheet" href="/css/secure-access.css">
    <link rel="icon" href="/img/logo-favicon.png" type="image/png">
</head>
<body class="secure-access-page">
    <main class="admin-app">
        <section class="admin-access-check" id="accessCheck" aria-live="polite">
        </section>

        <section class="admin-panel is-hidden" id="adminPanel">
            <div class="admin-workspace">
                <nav class="admin-tabs admin-main-tabs" aria-label="Sekcje panelu">
                    <button class="admin-tab admin-main-tab is-active" type="button" data-tab="questions">Baza pytań</button>
                    <button class="admin-tab admin-main-tab" type="button" data-tab="calendar">Kalendarz</button>
                </nav>

                <section class="tab-view admin-empty-view admin-questions-view" id="questionsView" aria-label="Baza pytań">
                    <div class="admin-action-toolbar" aria-label="Akcje bazy pytań">
                        <button class="admin-text-control admin-action-button is-active" type="button" id="allQuestionsButton">Wszystkie pytania</button>
                        <button class="admin-text-control admin-action-button" type="button" id="categoriesButton">Kategorie</button>
                        <button class="admin-text-control admin-action-button" type="button" id="importButton">Import</button>
                        <button class="admin-text-control admin-action-button" type="button" id="exportButton">Export</button>
                        <input type="file" id="importFileInput" accept=".json" class="is-hidden" aria-hidden="true">
                        <button class="admin-text-control admin-action-button is-primary" type="button" id="visibleSaveAllButton">Zapisz zmiany</button>
                    </div>
                    <div class="admin-content-panel" id="adminContentPanel"></div>
                </section>
                <section class="tab-view admin-empty-view is-hidden" id="calendarView" aria-label="Kalendarz"></section>
            </div>

            <div class="toast-container" id="toastContainer" aria-live="polite"></div>

            <div class="admin-logic-stubs" hidden aria-hidden="true">
                <p id="statusText">Gotowe.</p>
                <strong id="questionsTotal">0</strong>
                <strong id="calendarTotal">0</strong>
                <span id="saveState">Zapisane</span>
                <button type="button" id="saveAllButton"></button>
                <button type="button" id="fillCalendarButton"></button>
                <button type="button" id="addCategoryButton"></button>
                <button type="button" id="addQuestionButton"></button>
                <button type="button" id="deleteQuestionButton"></button>
                <button type="button" id="sortAnswersButton"></button>
                <div id="dayList"></div>
                <select id="calendarQuestionSelect"></select>
                <div id="calendarPreview"></div>
                <span id="selectedDayLabel"></span>
                <h2 id="selectedDayTitle"></h2>
                <div id="categoryList"></div>
                <div id="questionList"></div>
                <span id="activeCategoryLabel"></span>
                <form id="questionForm">
                    <div id="questionEmpty"></div>
                    <div id="questionFields" class="is-hidden">
                        <input id="questionTextInput" type="text">
                        <div id="answersForm"></div>
                    </div>
                </form>
            </div>

            <!-- Modal: Dodaj Kategorię -->
            <div class="admin-modal-overlay is-hidden" id="addCategoryModalOverlay" aria-hidden="true">
                <div class="admin-modal">
                    <div class="admin-modal-header">
                        <h2 class="admin-text-title">Dodaj nową kategorię</h2>
                    </div>
                    <div class="admin-modal-body">
                        <label class="admin-editor-field" style="margin-bottom: 1.5rem;">
                            <span class="admin-text-meta">Nazwa kategorii</span>
                            <input class="admin-text-control" type="text" id="addCategoryNameInput" placeholder="Np. Muzyka, Sport, Historia" autocomplete="off">
                        </label>
                        
                        <div class="admin-modal-questions-section">
                            <span class="admin-text-meta" style="display: block; margin-bottom: 0.75rem;">Możesz od razu przypisać "osierocone" pytania (Bez kategorii):</span>
                            <div class="admin-modal-questions-list" id="addCategoryQuestionsList">
                                <!-- Generowane przez JS -->
                            </div>
                        </div>
                    </div>
                    <div class="admin-modal-footer">
                        <button class="admin-text-control admin-action-button is-primary" type="button" id="addCategoryConfirmBtn">Dodaj kategorię</button>
                        <button class="admin-text-control admin-action-button" type="button" id="addCategoryCancelBtn">Anuluj</button>
                    </div>
                </div>
            </div>

            <!-- Modal: Edytuj Pytanie -->
            <div class="admin-modal-overlay is-hidden" id="editQuestionModalOverlay" aria-hidden="true">
                <div class="admin-modal" style="max-width: 42rem;">
                    <div class="admin-modal-header">
                        <h2 class="admin-text-title">Edytuj pytanie</h2>
                    </div>
                    <div class="admin-modal-body" id="editQuestionModalBody" style="padding-top: 1rem;">
                        <!-- Generowane przez JS -->
                    </div>
                    <div class="admin-modal-footer">
                        <button class="admin-text-control admin-action-button is-primary" type="button" id="editQuestionSaveBtn">Zapisz pytanie</button>
                        <button class="admin-text-control admin-action-button" type="button" id="editQuestionCloseBtn">Anuluj</button>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script src="/js/auth-client.js"></script>
    <script src="/rodziniada/js/admin.js"></script>
</body>
</html>
